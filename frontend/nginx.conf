server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # admin.html virou um app React (bundle externo via Vite, sem <script> inline) —
    # script-src não precisa mais de 'unsafe-inline'. style-src ainda precisa: vários
    # componentes React usam style={{...}} (inline style attribute).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.strokes.dev.br; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Alias /admin (sem extensão) -> admin.html, por conveniência
    location = /admin {
        rewrite ^ /admin.html break;
    }

    # SPA — redireciona tudo para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets com hash no nome (gerados pelo Vite)
    location ~* \.(js|css|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache curto para imagens e SVG
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # PWA — sem cache no service worker e manifest
    location ~* (service-worker\.js|manifest\.webmanifest)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}